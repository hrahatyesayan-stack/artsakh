<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Найди пару · Святыни Арцаха — игра</title>
<meta name="theme-color" content="#0b0e18" />
<meta name="description" content="Обучающая игра-мемори: открывай карточки и соединяй фото святынь Арцаха с их названиями. Запоминай Арцах в лицо. На трёх языках." />
<link rel="canonical" href="https://hrahatyesayan-stack.github.io/artsakh/memory-match.html" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E🃏%3C/text%3E%3C/svg%3E" />
<style>
  :root{--bg:#0b0e18;--ink:#f4ecdc;--mut:#a9a392;--gold:#caa23f;--gold2:#e8b96a;--red:#d90012;--blue:#0033a0;--apr:#f2a800;--ok:#3fb56b;--serif:Georgia,'Times New Roman',serif;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{min-height:100vh;background:radial-gradient(1200px 700px at 50% -10%,#141a2c,#0b0e18 60%);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  .flagbar{position:fixed;top:0;left:0;right:0;height:4px;display:flex;z-index:1200;}
  .flagbar i{flex:1;}.flagbar i:nth-child(1){background:var(--red);}.flagbar i:nth-child(2){background:var(--blue);}.flagbar i:nth-child(3){background:var(--apr);}
  header{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:12px 14px 10px;background:linear-gradient(180deg,rgba(11,14,24,.96),rgba(11,14,24,.7));backdrop-filter:blur(8px);z-index:1100;flex-wrap:wrap;}
  .back{color:var(--gold2);text-decoration:none;font-family:var(--serif);font-size:14px;white-space:nowrap;border:1px solid rgba(232,185,106,.4);padding:6px 12px;border-radius:20px;transition:.2s;}
  .back:hover{background:rgba(232,185,106,.12);}
  .htitle{font-family:var(--serif);font-size:17px;color:var(--gold2);letter-spacing:.03em;}
  .spacer{flex:1;}
  .stat{font-family:var(--serif);font-size:14px;color:var(--ink);white-space:nowrap;}
  .stat b{color:var(--gold2);}
  .langs{display:flex;gap:4px;}
  .langs button{font-family:var(--serif);font-size:11px;letter-spacing:.08em;color:var(--mut);background:transparent;border:1px solid rgba(169,163,146,.3);padding:5px 7px;border-radius:14px;cursor:pointer;transition:.15s;}
  .langs button.on{color:var(--bg);background:var(--gold2);border-color:var(--gold2);font-weight:700;}
  .wrap{max-width:680px;margin:0 auto;padding:14px 14px 90px;}
  .lead{text-align:center;color:var(--mut);font-size:14px;line-height:1.55;margin:6px auto 16px;max-width:520px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media(max-width:480px){ .grid{gap:7px;} }
  .card{position:relative;aspect-ratio:3/4;perspective:800px;cursor:pointer;}
  .card:focus-visible{outline:2px solid var(--gold2);outline-offset:3px;border-radius:13px;}
  .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.8,.3,1);}
  .card.up .inner,.card.done .inner{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .bk{background:linear-gradient(150deg,#1a2236,#0e1322);border:1px solid rgba(202,162,63,.3);}
  .bk svg{width:46%;height:46%;opacity:.5;}
  .fr{transform:rotateY(180deg);border:1px solid rgba(202,162,63,.5);background:#121726;}
  .fr.photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .fr.name{padding:6px;text-align:center;}
  .fr.name span{font-family:var(--serif);font-size:14px;line-height:1.25;color:var(--gold2);}
  @media(max-width:480px){ .fr.name span{font-size:12px;} }
  .card.done .face{border-color:var(--ok);}
  .card.done .inner{box-shadow:0 0 0 2px var(--ok),0 6px 18px rgba(63,181,107,.3);border-radius:12px;}
  .card.bad .fr{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0);}25%{transform:rotateY(180deg) translateX(-5px);}75%{transform:rotateY(180deg) translateX(5px);}}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(140%);z-index:1150;width:min(560px,92vw);background:rgba(16,20,32,.97);border:1px solid rgba(202,162,63,.5);border-radius:15px;padding:12px 16px;box-shadow:0 14px 40px rgba(0,0,0,.55);transition:transform .35s cubic-bezier(.2,.8,.2,1);font-size:14.5px;line-height:1.45;}
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast b{color:var(--gold2);}
  .overlay{position:fixed;inset:0;z-index:1300;display:none;align-items:center;justify-content:center;background:rgba(7,9,16,.93);backdrop-filter:blur(6px);padding:22px;}
  .overlay.show{display:flex;}
  .panel{max-width:440px;text-align:center;}
  .panel .em{font-size:54px;}
  .panel h1{font-family:var(--serif);font-size:28px;color:var(--gold2);margin:8px 0 6px;font-weight:700;}
  .panel p{color:var(--mut);font-size:15px;line-height:1.6;margin:8px 0;}
  .panel .big{font-family:var(--serif);font-size:20px;color:var(--ink);margin:10px 0;}
  .panel .big b{color:var(--gold2);}
  .btn{display:inline-block;font-family:var(--serif);font-size:15px;letter-spacing:.04em;color:var(--bg);background:linear-gradient(180deg,var(--gold2),var(--gold));border:none;padding:11px 26px;border-radius:24px;cursor:pointer;transition:.2s;font-weight:700;margin:16px 7px 0;text-decoration:none;}
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{color:var(--gold2);background:transparent;border:1px solid rgba(232,185,106,.5);font-weight:400;}
</style>
</head>
<body>
<div class="flagbar"><i></i><i></i><i></i></div>
<header>
  <a class="back" href="index.html">←&nbsp;<span data-t="back">Արцах</span></a>
  <div class="htitle" data-t="title">Найди пару</div>
  <div class="spacer"></div>
  <div class="stat"><span data-t="moves">Ходы</span> <b id="moves">0</b> · <span data-t="time">Время</span> <b id="time">0:00</b></div>
  <div class="langs"><button data-l="hy">ՀԱՅ</button><button data-l="ru">РУС</button><button data-l="en">ENG</button></div>
</header>

<div class="wrap">
  <p class="lead" data-t="lead">Открывай карточки и соединяй фото святыни с её названием. За каждую пару — факт о месте. Запомни Арцах в лицо.</p>
  <div class="grid" id="grid"></div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="win">
  <div class="panel">
    <div class="em">🏆</div>
    <h1 data-t="winH">Все пары найдены!</h1>
    <div class="big"><span data-t="winMoves">Ходов</span>: <b id="wMoves">0</b> · <span data-t="time">Время</span> <b id="wTime">0:00</b></div>
    <p id="wBest"></p>
    <p data-t="winP">Ты узнал святыни Арцаха в лицо. Сыграй ещё — будет новый набор мест.</p>
    <button class="btn" id="again" data-t="again">Играть снова</button>
    <a class="btn ghost" href="index.html" data-t="home">На главную</a>
  </div>
</div>

<script>
/* ── места: фото + название + факт (3 языка) ── */
const POOL=[
 {k:'gandzasar',img:'img/gandzasar.jpg',nm:{hy:'Գանձասար',ru:'Гандзасар',en:'Gandzasar'},f:{hy:'Արցախի գլխավոր վանքը (XIII դ.)։',ru:'Главный монастырь Арцаха (XIII в.).',en:'Artsakh’s main monastery (13th c.).'}},
 {k:'dadivank',img:'img/dadivank.jpg',nm:{hy:'Դադիվանք',ru:'Дадиванк',en:'Dadivank'},f:{hy:'XIII դ. վանք՝ հայտնի որմնանկարներով։',ru:'Монастырь XIII в., известен фресками.',en:'A 13th-c. monastery famed for frescoes.'}},
 {k:'amaras',img:'img/amaras.jpg',nm:{hy:'Ամարաս',ru:'Амарас',en:'Amaras'},f:{hy:'IV դ. վանք. այստեղ էր առաջին հայ դպրոցը։',ru:'Монастырь IV в.; здесь была первая армянская школа.',en:'A 4th-c. monastery; site of the first Armenian school.'}},
 {k:'tigranakert',img:'img/tigranakert.jpg',nm:{hy:'Տիգրանակերտ',ru:'Тигранакерт',en:'Tigranakert'},f:{hy:'Հնագույն հայկական քաղաք՝ Տիգրան Մեծի ժամանակներից։',ru:'Древний армянский город времён Тиграна Великого.',en:'An ancient Armenian city from the era of Tigranes the Great.'}},
 {k:'stepanakert',img:'img/stepanakert.jpg',nm:{hy:'Ստեփանակերտ',ru:'Степанакерт',en:'Stepanakert'},f:{hy:'Արցախի մայրաքաղաքը (1923)։',ru:'Столица Арцаха (1923).',en:'The capital of Artsakh (1923).'}},
 {k:'ghazan',img:'img/ghazan.jpg',nm:{hy:'Ղազանչեցոց',ru:'Казанчецоц',en:'Ghazanchetsots'},f:{hy:'Շուշիի մայր տաճարը (1888)։',ru:'Кафедральный собор Шуши (1888).',en:'The cathedral of Shushi (1888).'}},
 {k:'tsitsernavank',img:'img/tsitsernavank.jpeg',nm:{hy:'Ծիծեռնավանք',ru:'Цицернаванк',en:'Tsitsernavank'},f:{hy:'V–VI դդ. բազիլիկ՝ հնագույն եկեղեցիներից։',ru:'Базилика V–VI вв., из древнейших церквей.',en:'A 5th–6th c. basilica, among the oldest churches.'}},
 {k:'gtchavank',img:'img/gtchavank.jpg',nm:{hy:'Գտչավանք',ru:'Гтчаванк',en:'Gtchavank'},f:{hy:'XIII դ. վանք Դիզակում։',ru:'Монастырь XIII в. в Дизаке.',en:'A 13th-c. monastery in Dizak.'}},
 {k:'dizapayt',img:'img/dizapayt.jpg',nm:{hy:'Դիզափայտ',ru:'Дизапайт',en:'Dizapayt'},f:{hy:'Սուրբ լեռը (2478 մ)՝ Կատարո վանքով։',ru:'Священная гора (2478 м) с монастырём Катаро.',en:'A sacred mountain (2478 m) with Kataro monastery.'}},
 {k:'jraberd',img:'img/jraberd.jpg',nm:{hy:'Ջրաբերդ',ru:'Джраберд',en:'Jraberd'},f:{hy:'Միջնադարյան ամրոց Թարթառի ափին։',ru:'Средневековая крепость на реке Тертер.',en:'A medieval fortress on the Tartar river.'}},
 {k:'askeran',img:'img/askeran.jpg',nm:{hy:'Մայրաբերդ',ru:'Аскеран',en:'Askeran'},f:{hy:'XVIII դ. ամրոց՝ Շուշիի մատույցներին։',ru:'Крепость XVIII в. у подступов к Шуши.',en:'An 18th-c. fortress guarding Shushi.'}},
 {k:'sarsang',img:'img/sarsang.jpg',nm:{hy:'Սարսանգ',ru:'Сарсанг',en:'Sarsang'},f:{hy:'Ջրամբար Թարթառ գետի վրա (1976)։',ru:'Водохранилище на реке Тертер (1976).',en:'A reservoir on the Tartar river (1976).'}},
 {k:'handaberd',img:'img/handaberd.jpg',nm:{hy:'Հանդաբերդ',ru:'Андаберд',en:'Handaberd'},f:{hy:'IX դ. լեռնային ամրոց Խաչենում։',ru:'Горная крепость IX в. в Хачене.',en:'A 9th-c. mountain fortress in Khachen.'}},
 {k:'vankasar',img:'img/vankasar.jpg',nm:{hy:'Վանքասար',ru:'Ванкасар',en:'Vankasar'},f:{hy:'VII դ. խաչաձև եկեղեցի։',ru:'Крестообразная церковь VII в.',en:'A 7th-c. cruciform church.'}},
 {k:'kanach_zham',img:'img/kanach_zham.jpg',nm:{hy:'Կանաչ ժամ',ru:'Канач жам',en:'Kanach Zham'},f:{hy:'Շուշիի «Կանաչ ժամ» եկեղեցին (1847)։',ru:'Шушинская церковь «Канач жам» (1847).',en:'The “Green Chapel” of Shushi (1847).'}},
 {k:'gata',img:'img/gata.jpg',nm:{hy:'Գաթա',ru:'Гата',en:'Gata'},f:{hy:'Ավանդական հայկական քաղցր հաց։',ru:'Традиционный армянский сладкий хлеб.',en:'A traditional Armenian sweet bread.'}},
 {k:'khachkar',img:'img/khachkar.jpg',nm:{hy:'Խաչքար',ru:'Хачкар',en:'Khachkar'},f:{hy:'Հայկական խաչ-քարը՝ ՅՈՒՆԵՍԿՕ-ի ժառանգություն։',ru:'Армянский крест-камень, наследие ЮНЕСКО.',en:'The Armenian cross-stone, UNESCO heritage.'}},
 {k:'duduk',img:'img/duduk.jpg',nm:{hy:'Դուդուկ',ru:'Дудук',en:'Duduk'},f:{hy:'Հայ երաժշտության հոգին՝ ծիրանի փայտից։',ru:'Душа армянской музыки, из абрикоса.',en:'The soul of Armenian music, from apricot wood.'}},
];

const T={
 hy:{back:'Արցախ',title:'Գտի՛ր զույգը',moves:'Քայլ',time:'Ժամանակ',
   lead:'Բացի՛ր քարտերը և զուգի՛ր սրբավայրի լուսանկարը նրա անվան հետ։ Ամեն զույգի դիմաց՝ փաստ։ Ճանաչի՛ր Արցախը դեմքով։',
   winH:'Բոլոր զույգերը գտնված են',winMoves:'Քայլ',winP:'Դու ճանաչեցիր Արցախի սրբավայրերը դեմքով։ Խաղա՛ նորից՝ նոր վայրերով։',again:'Նորից խաղալ',home:'Գլխավոր',best:'Ռեկորդ',newbest:'Նոր ռեկորդ՛'},
 ru:{back:'Арцах',title:'Найди пару',moves:'Ходы',time:'Время',
   lead:'Открывай карточки и соединяй фото святыни с её названием. За каждую пару — факт о месте. Запомни Арцах в лицо.',
   winH:'Все пары найдены!',winMoves:'Ходов',winP:'Ты узнал святыни Арцаха в лицо. Сыграй ещё — будет новый набор мест.',again:'Играть снова',home:'На главную',best:'Рекорд',newbest:'Новый рекорд!'},
 en:{back:'Artsakh',title:'Find the pair',moves:'Moves',time:'Time',
   lead:'Flip the cards and match each sacred site’s photo with its name. Every pair reveals a fact. Learn Artsakh by heart.',
   winH:'All pairs found!',winMoves:'Moves',winP:'You have learned the sacred sites of Artsakh by sight. Play again for a new set of places.',again:'Play again',home:'Home',best:'Best',newbest:'New best!'},
};

const PAIRS=6;
let lang='ru', deck=[], flipped=[], matched=0, moves=0, lock=false, t0=0, timer=null;

function getLang(){ try{return localStorage.getItem('artsakh_lang')||'';}catch(e){return '';} }
function setLangStore(l){ try{localStorage.setItem('artsakh_lang',l);}catch(e){} }
function getBest(){ try{return +localStorage.getItem('artsakh_mem_best')||0;}catch(e){return 0;} }
function setBest(v){ try{localStorage.setItem('artsakh_mem_best',v);}catch(e){} }
const $=s=>document.querySelector(s);

function applyT(){
  document.querySelectorAll('[data-t]').forEach(el=>{const k=el.getAttribute('data-t'); if(T[lang][k]!=null) el.textContent=T[lang][k];});
  document.documentElement.lang=lang;
  document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.getAttribute('data-l')===lang));
  // re-label name cards already in DOM
  document.querySelectorAll('.fr.name span').forEach(s=>{ const k=s.getAttribute('data-k'); const p=POOL.find(x=>x.k===k); if(p) s.textContent=p.nm[lang]; });
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const MTN="<svg viewBox='0 0 100 100'><path d='M10 78 L34 40 L50 60 L68 32 L90 78 Z' fill='#caa23f'/></svg>";

function build(){
  const pick=shuffle(POOL).slice(0,PAIRS);
  let cards=[];
  pick.forEach(p=>{ cards.push({k:p.k,type:'photo',img:p.img}); cards.push({k:p.k,type:'name'}); });
  deck=shuffle(cards);
  const g=$('#grid'); g.innerHTML='';
  deck.forEach((c,i)=>{
    const el=document.createElement('div'); el.className='card'; el.dataset.i=i; el.dataset.k=c.k;
    el.tabIndex=0; el.setAttribute('role','button'); el.setAttribute('aria-label', lang==='hy'?'քարտ':lang==='en'?'card':'карта');
    const front = c.type==='photo'
      ? `<div class="face fr photo"><img src="${c.img}" alt="" onerror="this.style.opacity=0"></div>`
      : `<div class="face fr name"><span data-k="${c.k}">${(POOL.find(x=>x.k===c.k)||{}).nm[lang]}</span></div>`;
    el.innerHTML=`<div class="inner"><div class="face bk">${MTN}</div>${front}</div>`;
    el.addEventListener('click',()=>flip(i,el));
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(i,el); } });
    g.appendChild(el);
  });
  matched=0; moves=0; flipped=[]; lock=false; t0=0;
  $('#moves').textContent='0'; $('#time').textContent='0:00';
  clearInterval(timer); timer=null;
}

function startTimer(){ if(timer) return; t0=Date.now(); timer=setInterval(()=>{
  const s=Math.floor((Date.now()-t0)/1000); $('#time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
},500); }

function flip(i,el){
  if(lock || el.classList.contains('up') || el.classList.contains('done')) return;
  startTimer();
  el.classList.add('up'); flipped.push({i,el,k:deck[i].k});
  if(flipped.length===2){
    moves++; $('#moves').textContent=moves; lock=true;
    const [a,b]=flipped;
    if(a.k===b.k){
      setTimeout(()=>{ a.el.classList.add('done'); b.el.classList.add('done'); a.el.classList.remove('up'); b.el.classList.remove('up');
        matched++; flipped=[]; lock=false; showFact(a.k);
        if(matched===PAIRS) win();
      },420);
    } else {
      a.el.classList.add('bad'); b.el.classList.add('bad');
      setTimeout(()=>{ a.el.classList.remove('up','bad'); b.el.classList.remove('up','bad'); flipped=[]; lock=false; },900);
    }
  }
}

let toastTimer=null;
function showFact(k){
  const p=POOL.find(x=>x.k===k); if(!p) return;
  const t=$('#toast'); t.innerHTML='<b>'+p.nm[lang]+'.</b> '+p.f[lang]; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

function win(){
  clearInterval(timer); timer=null;
  const s=Math.floor((Date.now()-t0)/1000);
  $('#wMoves').textContent=moves; $('#wTime').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  const best=getBest(); let msg='';
  if(best===0 || moves<best){ setBest(moves); msg='✨ '+T[lang].newbest; }
  else msg=T[lang].best+': '+best;
  $('#wBest').textContent=msg;
  setTimeout(()=>$('#win').classList.add('show'),500);
}

document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>{lang=b.getAttribute('data-l');setLangStore(lang);applyT();}));
$('#again').addEventListener('click',()=>{ $('#win').classList.remove('show'); build(); });

(function init(){
  const s=getLang(); const nl=(navigator.language||'ru').toLowerCase();
  lang=(s==='hy'||s==='ru'||s==='en')?s:(nl.startsWith('hy')?'hy':nl.startsWith('en')?'en':'ru');
  build(); applyT();
})();
</script>
</body>
</html>
