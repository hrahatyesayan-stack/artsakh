յուն","ru":"Армянская миниатюра","en":"Armenian miniature"},"d":{"hy":"Հայկական մանրանկարչությունը՝ ձեռագիր Ավետարանների փառքը։","ru":"Армянская миниатюра — краса рукописных Евангелий.","en":"Armenian illumination — the glory of handwritten Gospels."}},{"img":"img/trndez.jpg","sec":"culture","t":{"hy":"Տրնդեզ","ru":"Трндез","en":"Trndez"},"d":{"hy":"Տյառնընդառաջի կրակի տոնը. այս լուսանկարը՝ Դադիվանքում։","ru":"Праздник Трндез с прыжками через огонь; этот снимок — в Дадиванке.","en":"The Trndez fire feast; this photo was taken at Dadivank."}},{"img":"img/tutovka.jpg","sec":"culture","t":{"hy":"Թթի օղի","ru":"Тутовка","en":"Mulberry vodka"},"d":{"hy":"Թթի օղին՝ Արցախի ավանդական թթենու թունդ թորվածքը։","ru":"Тутовка — традиционная для Карабаха крепкая тутовая водка.","en":"Tutovka — a strong mulberry spirit traditional to Karabakh."}},{"img":"img/taraz.jpg","sec":"culture","t":{"hy":"Տարազ","ru":"Тараз","en":"Taraz"},"d":{"hy":"Հայկական ազգային տարազը՝ բրդից, մետաքսից և մորթուց։","ru":"Армянский национальный костюм — из шерсти, шёлка и меха.","en":"The Armenian national costume — of wool, silk and fur."}}];
const T={hy:{back:'Արցախ',title:'Ի՞նչ է սա',round:'Փուլ',pts:'Միավոր',next:'Հաջորդը →',qThing:'Ի՞նչ է սա',qWho:'Ո՞վ է սա',
  introH:'Ի՞նչ է սա',introP:'Լուսանկարով ճանաչի՛ր Արցախի սրբավայրը, անձը կամ խորհրդանիշը՝ ընտրի՛ր ճիշտ անունը։ Պատասխանից հետո կիմանաս փաստը։ Այսպես կսովորես ճանաչել Արցախը դեմքով։',start:'Սկսել',
  finalH:'Պատրա՛ստ է',best:'Ռեկորդ',again:'Նորից խաղալ',home:'Գլխավոր',
  msg:['Դու Արցախը ճանաչում ես հիանալի՛։','Լավ է՝ դու սովորում ես Արցախը։','Փորձի՛ր նորից։']},
 ru:{back:'Арцах',title:'Что это?',round:'Раунд',pts:'Очки',next:'Дальше →',qThing:'Что это?',qWho:'Кто это?',
  introH:'Что это?',introP:'По фотографии узнай святыню, личность или символ Арцаха — выбери правильное название. После ответа узнаёшь факт. Так учишься узнавать Арцах в лицо.',start:'Начать',
  finalH:'Готово!',best:'Рекорд',again:'Играть снова',home:'На главную',
  msg:['Ты отлично узнаёшь Арцах!','Хорошо — ты учишь Арцах.','Сыграй ещё раз.']},
 en:{back:'Artsakh',title:'What is it?',round:'Round',pts:'Score',next:'Next →',qThing:'What is it?',qWho:'Who is it?',
  introH:'What is it?',introP:'From a photo, recognise a sacred site, figure or symbol of Artsakh — pick the right name. After answering you learn a fact. This is how you learn to know Artsakh by sight.',start:'Start',
  finalH:'Done!',best:'Best',again:'Play again',home:'Home',
  msg:['You recognise Artsakh brilliantly!','Good — you are learning Artsakh.','Play again.']}};
const ROUNDS=10;
let lang='ru', rounds=[], i=0, score=0, answered=false, cur=null;
const $=s=>document.querySelector(s);
function getLang(){try{return localStorage.getItem('artsakh_lang')||'';}catch(e){return '';}}
function setLangStore(l){try{localStorage.setItem('artsakh_lang',l);}catch(e){}}
function getBest(){try{return +localStorage.getItem('artsakh_guess_best')||0;}catch(e){return 0;}}
function setBest(v){try{localStorage.setItem('artsakh_guess_best',v);}catch(e){}}
function shuffle(a){a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]];}return a;}
function applyT(){document.querySelectorAll('[data-t]').forEach(el=>{const k=el.getAttribute('data-t');if(T[lang][k]!=null)el.textContent=T[lang][k];});document.documentElement.lang=lang;document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.getAttribute('data-l')===lang));$('#tot').textContent=ROUNDS;if(cur)showRound(true);}
function start(){rounds=shuffle(POOL).slice(0,ROUNDS);i=0;score=0;$('#scr').textContent=0;$('#intro').classList.remove('show');$('#final').classList.remove('show');showRound();}
function showRound(keep){ if(!keep){answered=false;cur=rounds[i];} const ans=cur;
  $('#rnd').textContent=i+1; $('#q').textContent = ans.sec==='figures'?T[lang].qWho:T[lang].qThing;
  const im=$('#pimg'); im.src=ans.img; im.onerror=()=>{im.style.opacity=0;}; im.style.opacity=1;
  const opts = keep ? curOpts : shuffle([ans, ...shuffle(POOL.filter(p=>p.img!==ans.img)).slice(0,3)]);
  curOpts=opts;
  const box=$('#opts'); box.innerHTML='';
  opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.type='button';b.textContent=o.t[lang];
    if(answered){ b.disabled=true; if(o.img===ans.img)b.classList.add('ok'); }
    else b.addEventListener('click',()=>pick(o,b));
    box.appendChild(b);});
  if(answered){ $('#fact').innerHTML='<b>'+ans.t[lang]+'.</b> '+ans.d[lang]; $('#fact').classList.add('show'); $('#next').classList.add('show'); $('#next').textContent=(i>=ROUNDS-1)?(lang==='hy'?'Արդյունք →':lang==='en'?'Result →':'Итог →'):T[lang].next; }
  else { $('#fact').classList.remove('show'); $('#next').classList.remove('show'); }
}
let curOpts=[];
function pick(o,btn){ if(answered)return; answered=true;
  const ans=cur;
  [...$('#opts').children].forEach(b=>{b.disabled=true; if(b.textContent===ans.t[lang])b.classList.add('ok');});
  if(o.img===ans.img){ score++; $('#scr').textContent=score; } else { btn.classList.add('no'); }
  $('#fact').innerHTML='<b>'+ans.t[lang]+'.</b> '+ans.d[lang]; $('#fact').classList.add('show');
  $('#next').classList.add('show'); $('#next').textContent=(i>=ROUNDS-1)?(lang==='hy'?'Արդյունք →':lang==='en'?'Result →':'Итог →'):T[lang].next;
}
function next(){ if(i>=ROUNDS-1){end();return;} i++; answered=false; cur=rounds[i]; showRound(); window.scrollTo({top:0,behavior:'smooth'}); }
function end(){ const best=Math.max(getBest(),score); setBest(best); $('#ftot').textContent=score; $('#fmax').textContent=ROUNDS; $('#fbest').textContent=best;
  const r=score/ROUNDS; $('#fem').textContent=r>=.8?'🏆':r>=.5?'🎖️':'❓'; $('#fmsg').textContent=T[lang].msg[r>=.8?0:r>=.5?1:2]; $('#final').classList.add('show'); }
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>{lang=b.getAttribute('data-l');setLangStore(lang);applyT();}));
$('#start').addEventListener('click',start); $('#again').addEventListener('click',start); $('#next').addEventListener('click',next);
(function init(){const s=getLang(),nl=(navigator.language||'ru').toLowerCase();lang=(s==='hy'||s==='ru'||s==='en')?s:(nl.startsWith('hy')?'hy':nl.startsWith('en')?'en':'ru');applyT();})();
</script>
