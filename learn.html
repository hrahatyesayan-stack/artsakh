const SEC={all:{hy:'Ամենը',ru:'Всё',en:'All'},holy:{hy:'Սրբավայրեր',ru:'Святыни',en:'Sacred'},culture:{hy:'Մշակույթ',ru:'Культура',en:'Culture'},figures:{hy:'Անձինք',ru:'Личности',en:'Figures'},nature:{hy:'Բնություն',ru:'Природа',en:'Nature'},towns:{hy:'Քաղաքներ',ru:'Города',en:'Towns'}};
const T={hy:{back:'Արցախ',title:'Սովորիր Արցախը',hint:'Սեղմի՛ր քարտին՝ շրջելու համար'},ru:{back:'Арцах',title:'Учи Арцах',hint:'Нажми на карточку, чтобы перевернуть'},en:{back:'Artsakh',title:'Learn Artsakh',hint:'Tap the card to flip it'}};
let lang='ru', filter='all', list=[], i=0;
const $=s=>document.querySelector(s);
function getLang(){try{return localStorage.getItem('artsakh_lang')||'';}catch(e){return '';}}
function setLangStore(l){try{localStorage.setItem('artsakh_lang',l);}catch(e){}}
function applyStatic(){ document.querySelectorAll('[data-t]').forEach(el=>{const k=el.getAttribute('data-t');if(T[lang][k]!=null)el.textContent=T[lang][k];}); document.documentElement.lang=lang; document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.getAttribute('data-l')===lang)); }
function buildChips(){ const c=$('#chips'); c.innerHTML=''; ['all','holy','figures','culture','nature','towns'].forEach(s=>{const b=document.createElement('button'); b.textContent=SEC[s][lang]; b.classList.toggle('on',s===filter); b.addEventListener('click',()=>{filter=s;rebuild();buildChips();}); c.appendChild(b);}); }
function rebuild(){ list=(filter==='all')?CARDS:CARDS.filter(c=>c.sec===filter); i=0; render(); }
function render(){ if(!list.length)return; const c=list[i]; $('#flip').classList.remove('on');
  const im=$('#fimg'); im.src=c.img; im.onerror=()=>{im.style.opacity=0;}; im.style.opacity=1;
  $('#fnm').textContent=c.t[lang]; $('#bnm').textContent=c.t[lang]; $('#bf').textContent=c.d[lang]; $('#bbadge').textContent=SEC[c.sec][lang];
  const n=i+1, m=list.length; $('#cur').textContent=n; $('#tot').textContent=m; $('#cur2').textContent=n; $('#tot2').textContent=m;
}
function go(d){ if(!list.length)return; i=(i+d+list.length)%list.length; render(); }
$('#flip').addEventListener('click',()=>$('#flip').classList.toggle('on'));
$('#prev').addEventListener('click',e=>{e.stopPropagation();go(-1);});
$('#next').addEventListener('click',e=>{e.stopPropagation();go(1);});
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);else if(e.key==='ArrowRight')go(1);else if(e.key===' '){e.preventDefault();$('#flip').classList.toggle('on');}});
let sx=0; $('#flip').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('#flip').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50){go(dx<0?1:-1);}});
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>{lang=b.getAttribute('data-l');setLangStore(lang);applyStatic();buildChips();render();}));
(function init(){ const s=getLang(),nl=(navigator.language||'ru').toLowerCase(); lang=(s==='hy'||s==='ru'||s==='en')?s:(nl.startsWith('hy')?'hy':nl.startsWith('en')?'en':'ru'); applyStatic(); buildChips(); rebuild(); })();
</script>
</body>
</html>
